{% extends "base.html" %}{% block body %}<h2>Create account</h2>
<form method="post" novalidate><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="name">First name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required>
<div id="par" hidden><label for="pe">Parent/guardian email</label><input id="pe" name="parent_email" type="email">
<label class="o"><input type="checkbox" name="consent"> I am the parent/guardian and I consent</label></div>
<label for="pw">Password (min. 8 characters)</label><input id="pw" name="password" type="password" minlength="8" required><meter id="m" max="4" style="width:100%"></meter>
<label for="pw2">Confirm password</label><input id="pw2" name="password2" type="password" required>
<label class="o"><input type="checkbox" name="terms"> I accept the Terms and Privacy Policy</label>
<p><button class="pri">Sign up</button></p></form>{% endblock %}
{% block js %}<script>
document.getElementById('dob').onchange=e=>{const d=new Date(e.target.value),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;document.getElementById('par').hidden=!(a<18)};
document.getElementById('pw').oninput=e=>{const v=e.target.value;m.value=(v.length>=8)+/[A-Z]/.test(v)+/\d/.test(v)+/\W/.test(v)};</script>{% endblock %}
